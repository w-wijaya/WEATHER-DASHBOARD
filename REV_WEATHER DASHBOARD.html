<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>

        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f1117;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            padding: 24px;
            min-height: 100vh;
        }

        /* === SEARCH BAR === */
        #search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            max-width: 100%;
        }

        #dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            column-gap: 12px;
            row-gap: 6px;
            align-items: stretch;
        }

        #weather-card {
            grid-column: 1;
            grid-row: 1/3;
            height: 100%;
        }

        #chart-section { 
            grid-column: 2;
            grid-row: 2;
        }

        #search-input {
            flex: 1;
            background: #1e2130;
            border: 1px solid #2e3250;
            border-radius: 10px;
            padding: 12px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }

        #search-input:focus {
            border-color: #4f8ef7;
        }

        #search-btn {
            background: #4f8ef7;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }

        #search-btn:hover {
            background: #3a7ae0;
        }

        /* === WEATHER CARD === */
        #weather-card {
            background: #1e2130;
            border: 1px solid #2e3250;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        #city-name {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 7px;
        }

        #country {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        #temperature {
            font-size: 52px;
            font-weight: 800;
            color: #4f8ef7;
            margin-bottom: 4px;
        }

        #condition {
            font-size: 15px;
            color: #a0aec0;
            margin-bottom: 20px;
            text-transform: capitalize;
        }

        .weather-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .meta-item {
            background: #0f1117;
            border-radius: 10px;
            padding: 12px 16px;
        }

        .meta-label {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-value {
            font-size: 18px;
            font-weight: 600;
            color: #e0e0e0;
        }

        /* === CHART SECTION === */
        #chart-section {
            background: #1e2130;
            border: 1px solid #2e3250;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 1px;
        }

        #chart-section h2 {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #forecast-chart {
            width: 100%;
            height: 200px;
        }

        /* === MAP SECTION === */
        #map-section {
            background: #1e2130;
            border: 1px solid #2e3250;
            padding: 24px;
            border-radius: 16px;
        }

        #map-section h2 {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #map {
            width: 100%;
            height: 250px;
            border-radius: 10px;
            background: #0f1117;
        }

        footer {
    text-align: center;
    color: #6b7280;
    font-size: 12px;
    padding: 24px;
    margin-top: 24px;
    border-top: 1px solid #2e3250;
}

footer span {
    color: #4f8ef7;
    font-weight: 700;
}

        /* === HEADER === */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: #1e2130;
            border: 1px solid #2e3250;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        #header h1 {
            color: #ffffff;
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        #header p {
            color: #6b7280;
            font-size: 17px;
            margin: 0;
        }

        #live-time {
            color: #4f8ef7;
            font-size: 14px;
            font-weight: 600;
            text-align: right;
        }

        #live-date {
            color: #6b7280;
            font-size: 15px;
            text-align: right;
            margin-top: 4px;
        }

        #weather-icon {
            font-size: 64px;
            margin-bottom: 8px;
            line-height: 1;
}

        /* === RESPONSIVE MOBILE === */
@media (max-width: 500px) {

    body {
        padding: 12px;
    }

    /* search bar stacks vertically */
    #search-section {
        flex-direction: column;
    }

    #search-btn {
        width: 100%;
        text-align: center;
    }

    /* city name smaller */
    #city-name {
        font-size: 22px;
    }

    /* temperature smaller */
    #temperature {
        font-size: 38px;
    }

    /* meta grid goes 1 column instead of 2 */
    .weather-meta {
        grid-template-columns: 1fr;
    }

    /* chart height smaller */
    #forecast-chart {
        height: 160px;
    }

    /* map height smaller */
    #map {
        height: 200px;
    }

    /* === SPINNER === */
#spinner {
    text-align: center;
    padding: 24px;
    color: #6b7280;
    font-size: 13px;
}

.spinner-circle {
    width: 40px;
    height: 40px;
    border: 4px solid #2e3250;
    border-top: 4px solid #4f8ef7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
}

@keyframes spin {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
}
    </style>
</head>
<body>
    <!-- LOADING SPINNER -->
<div id="spinner" style="display:none;">
    <div class="spinner-circle"></div>
    <p>Fetching weather...</p>
</div>

    <!-- HEADER -->
<div id="header">
    <div>
        <h1>🌤️ Weather Dashboard</h1>
        <p>Real-time weather data around the world</p>
    </div>
    <div>
        <p id="live-time">--:--:--</p>
        <p id="live-date">--- --, ----</p>
    </div>
</div>

    <!-- SEARCH BAR -->
    <div id="search-section">
        <input type="text" id="search-input" placeholder="Search city...">
        <button id="search-btn">Search</button>
    </div>

    <div id="dashboard"> 

    <!-- CURRENT WEATHER CARD -->
    <div id="weather-card">
        <h1 id="city-name">City Name</h1>
        <p id="country">Country</p>
        <p id="temperature">--°C</p>
        <p id="weather-icon">🌡️</p>
        <p id="condition">Condition</p>

        <!-- meta grid -->
        <div class="weather-meta">
            <div class="meta-item">
                <div class="meta-label">Humidity</div>
                <div class="meta-value" id="humidity">--%</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Wind</div>
                <div class="meta-value" id="wind">-- km/h</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Feels Like</div>
                <div class="meta-value" id="feels-like">--°C</div>
            </div>
            <div class="meta-item">
                <div class="meta-label">Pressure</div>
                <div class="meta-value" id="pressure">-- hPa</div>
            </div>
        </div>
    </div>

    <!-- CHART SECTION -->
    <div id="chart-section">
        <h2>5-Day Forecast</h2>
        <canvas id="forecast-chart"></canvas>
    </div>

    <!-- MAP SECTION -->
    <div id="map-section">
        <h2>Location Map</h2>
        <div id="map"></div>
    </div>

</div>
<footer>
    <p>© 2026 Weather Dashboard</p>
    <p>This my Practice <span>Waskita Wijaya</span></p>
</footer>

    <script>
        const API_KEY = '2173867f0b1d1a8991538efb3aad8b9d';

        // ===== SPINNER =====
function showSpinner() {
    document.getElementById('spinner').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
}

function hideSpinner() {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('dashboard').style.display = 'grid';
}

        // ===== WEATHER ICON =====
function getWeatherIcon(id) {
    // Thunderstorm
    if (id >= 200 && id < 300) return '⛈️';

    // Drizzle
    if (id >= 300 && id < 400) return '🌦️';

    // Rain
    if (id >= 500 && id < 600) {
        if (id === 511) return '🌨️'; // freezing rain
        return '🌧️';
    }

    // Snow
    if (id >= 600 && id < 700) return '❄️';

    // Atmosphere (fog, mist, haze)
    if (id >= 700 && id < 800) return '🌫️';

    // Clear sky
    if (id === 800) return '☀️';

    // Clouds
    if (id === 801) return '🌤️'; // few clouds
    if (id === 802) return '⛅';  // scattered clouds
    if (id === 803) return '🌥️'; // broken clouds
    if (id === 804) return '☁️'; // overcast clouds

    // default
    return '🌡️';
}

        // ===== LIVE CLOCK =====
function updateTime() {
    const now = new Date();
    const time = now.toLocaleTimeString('en', { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit' 
    });
    const date = now.toLocaleDateString('en', { 
        weekday: 'short', 
        month: 'short', 
        day: 'numeric', 
        year: 'numeric' 
    });
    document.getElementById('live-time').textContent = time;
    document.getElementById('live-date').textContent = date;
}

updateTime();
setInterval(updateTime, 1000);


        // ===== GRAB ELEMENTS =====
        const searchBtn = document.getElementById('search-btn');
        const searchInput = document.getElementById('search-input');
        const cityName = document.getElementById('city-name');
        const country = document.getElementById('country');
        const temperature = document.getElementById('temperature');
        const condition = document.getElementById('condition');
        const humidity = document.getElementById('humidity');
        const wind = document.getElementById('wind');
        const feelsLike = document.getElementById('feels-like');
        const pressure = document.getElementById('pressure');

        // ===== LISTEN FOR CLICK =====
        searchBtn.addEventListener('click', function() {
            const city = searchInput.value.trim();
            if (city === '') {
                alert('Please enter a city name!');
                return;
            }
            fetchWeather(city);
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const city = searchInput.value.trim();
                if (city !== '') fetchWeather(city);
            }
        });

        // ===== FETCH CURRENT WEATHER =====
        function fetchWeather(city) {
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`;

            showSpinner();

            fetch(url)
                .then(function(response) {
                    if (!response.ok) {
                        hideSpinner();
                        alert('City not found! Try again.');
                        return;
                    }
                    return response.json();
                })
                .then(function(data) {
                    hideSpinner();
                    displayWeather(data);
                })
                .catch(function(error) {
                    hideSpinner();
                    console.log('Error:', error);
                    alert('Something went wrong!');
                });
        }

        // ===== DISPLAY WEATHER =====
        function displayWeather(data) {
            cityName.textContent = data.name;
            country.textContent = data.sys.country;
            temperature.textContent = Math.round(data.main.temp) + '°C';
            condition.textContent = data.weather[0].description;
            humidity.textContent = data.main.humidity + '%';
            wind.textContent = Math.round(data.wind.speed * 3.6) + ' km/h';
            feelsLike.textContent = Math.round(data.main.feels_like) + '°C';
            pressure.textContent = data.main.pressure + ' hPa';

            document.getElementById('weather-icon').textContent = getWeatherIcon(data.weather[0].id);

            fetchForecast(searchInput.value.trim());
            displayMap(data.coord.lat, data.coord.lon, data.name);
        }

        // ===== FETCH FORECAST =====
        function fetchForecast(city) {
            const url = `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${API_KEY}&units=metric`;

            fetch(url)
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    displayChart(data);
                })
                .catch(function(error) {
                    console.log('Forecast error:', error);
                });
        }

        // ===== DISPLAY CHART =====
        let myChart = null;

        function displayChart(data) {
            const dailyMap = {};

            data.list.forEach(function(item) {
                const date = new Date(item.dt * 1000).toDateString();

                if (!dailyMap[date]) {
                    dailyMap[date] = {
                        max: -999,
                        min: 999,
                        label: new Date(item.dt * 1000)
                            .toLocaleDateString('en', { weekday: 'short', month: 'short', day: 'numeric' })
                    };
                }

                if (item.main.temp_max > dailyMap[date].max) {
                    dailyMap[date].max = Math.round(item.main.temp_max);
                }
                if (item.main.temp_min < dailyMap[date].min) {
                    dailyMap[date].min = Math.round(item.main.temp_min);
                }
            });

            const days = Object.values(dailyMap).slice(0, 5);
            const labels = days.map(function(d) { return d.label; });
            const maxTemps = days.map(function(d) { return d.max; });
            const minTemps = days.map(function(d) { return d.min; });

            if (myChart) {
                myChart.destroy();
            }

            const ctx = document.getElementById('forecast-chart').getContext('2d');

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Max Temp (°C)',
                            data: maxTemps,
                            backgroundColor: '#4f8ef7',
                            borderRadius: 6
                        },
                        {
                            label: 'Min Temp (°C)',
                            data: minTemps,
                            backgroundColor: '#1e3a5f',
                            borderRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: { color: '#a0aec0' }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    return ctx.dataset.label + ': ' + ctx.parsed.y + '°C';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#6b7280' },
                            grid: { color: '#2e3250' }
                        },
                        y: {
                            ticks: {
                                color: '#6b7280',
                                callback: function(val) { return val + '°C'; }
                            },
                            grid: { color: '#2e3250' }
                        }
                    }
                }
            });
        }

        // ===== MAP =====
        let myMap = null;

        function displayMap(lat, lon, cityName) {
            if (myMap) {
                myMap.remove();
                myMap = null;
            }

            myMap = L.map('map').setView([lat, lon], 11);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap © CARTO'
            }).addTo(myMap);

            L.marker([lat, lon])
                .addTo(myMap)
                .bindPopup(`<b>${cityName}</b>`)
                .openPopup();
        }

    </script>
</body>
</html>
